let data = EMBEDDED_DATA;
let currentVersion = data.versions[0].version;

function groupByYear(versions) {
  const groups = {};
  versions.forEach(v => {
    const year = (v.date || '').split('-')[0] || 'Unknown';
    if (!groups[year]) groups[year] = [];
    groups[year].push(v);
  });
  return Object.entries(groups).sort((a, b) => b[0].localeCompare(a[0]));
}

function renderSidebar() {
  const sidebar = document.getElementById('sidebar');
  const groups = groupByYear(data.versions);
  let html = '';
  groups.forEach(([year, vers]) => {
    html += '<div class="year-group"><div class="year-label">' + year + '</div>';
    vers.forEach(v => {
      const isLatest = v.version === data.versions[0].version;
      const isActive = v.version === currentVersion;
      html += '<div class="version-item ' + (isActive ? 'active' : '') + '" onclick="switchVersion(\'' + v.version + '\')">';
      html += '<span>v' + v.version + '</span>';
      html += (isLatest ? '<span class="latest-tag">Latest</span>' : '');
      html += '</div>';
    });
    html += '</div>';
  });
  sidebar.innerHTML = html;

  const select = document.getElementById('mobileSelect');
  select.innerHTML = data.versions.map(v =>
    '<option value="' + v.version + '" ' + (v.version === currentVersion ? 'selected' : '') + '>v' + v.version + (v.version === data.versions[0].version ? ' (Latest)' : '') + ' - ' + (v.date || '') + '</option>'
  ).join('');
}

function renderContent() {
  const v = data.versions.find(x => x.version === currentVersion) || data.versions[0];
  const main = document.getElementById('mainContent');

  document.getElementById('versionBadge').textContent = 'Latest: v' + data.versions[0].version;
  document.getElementById('lastUpdated').textContent = new Date(data.updated_at).toLocaleString();

  let html = '<div class="card">';
  html += '<div class="version-header"><div>';
  html += '<div class="version-title">' + (v.title || 'Version ' + v.version) + '</div>';
  html += '<div class="version-date">' + (v.date || '') + '</div>';
  html += '</div></div>';

  if (v.sections) {
    v.sections.forEach(sec => {
      html += '<div class="section"><div class="section-title">' + sec.title + '</div>';
      sec.items.forEach(item => {
        html += '<div class="item">' + item + '</div>';
      });
      html += '</div>';
    });
  }

  if (v.download_url) {
    html += '<div class="download-section"><div class="download-title">Download Information</div>';
    html += '<div class="download-grid">';
    html += '<div class="info-item"><div class="info-label">Full Installer</div><div class="info-value"><a href="' + v.download_url + '" target="_blank">Download</a></div></div>';
    html += '<div class="info-item"><div class="info-label">Size</div><div class="info-value">' + (v.size_mb || '') + ' MB' + (v.size ? ' (' + v.size.toLocaleString() + ' bytes)' : '') + '</div></div>';
    html += '<div class="info-item"><div class="info-label">MD5</div><div class="info-value">' + (v.md5 || '-') + '</div></div>';
    html += '</div>';
    html += '<a href="' + v.download_url + '" class="download-btn" target="_blank">Download v' + v.version + '</a>';
    html += '</div>';
  }

  html += '</div>';
  main.innerHTML = html;
}

function switchVersion(ver) {
  currentVersion = ver;
  renderSidebar();
  renderContent();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function loadData() {
  try {
    const resp = await fetch('data.json?t=' + Date.now());
    if (resp.ok) {
      data = await resp.json();
      currentVersion = data.versions[0].version;
    }
  } catch (e) {}
  renderSidebar();
  renderContent();
}

loadData();
