name: Rewrite Git History
on:
  workflow_dispatch:

jobs:
  rewrite:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rewrite all commits to GitHub Action
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git filter-branch -f --env-filter '
            export GIT_AUTHOR_NAME="GitHub Action"
            export GIT_AUTHOR_EMAIL="action@github.com"
            export GIT_COMMITTER_NAME="GitHub Action"
            export GIT_COMMITTER_EMAIL="action@github.com"
          ' HEAD
          git push -f origin main
      - name: Remove this workflow
        run: |
          rm -f .github/workflows/rewrite-history.yml
          git add .github/workflows/rewrite-history.yml
          git commit -m "Remove rewrite workflow" || true
          git push origin main || true
