name: Update PDFelement Changelog

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Generate data (detect latest + repair changelog)
        id: detect
        run: |
          output=$(python generate_data.py)
          echo "$output"
          if echo "$output" | grep -qE "New version added|Repaired [1-9]"; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "✅ 检测到版本变化或日志修复，将推送前端"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "无版本变化"
          fi

      - name: Embed data into HTML
        if: steps.detect.outputs.changed == 'true'
        run: python embed_data.py

      - name: Commit and push (real-time update)
        if: steps.detect.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update PDFelement changelog (3h)" && git push)
